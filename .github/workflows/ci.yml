name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Build and test
        run: mvn -B clean test

      - name: Install to local repo
        run: mvn -B install -DskipTests

      - name: Test example-consumer
        run: mvn -B -f example-consumer/pom.xml clean test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Build and test
        run: mvn -B clean test

      - name: Install to local repo
        run: mvn -B install -DskipTests

      - name: Test example-consumer
        run: mvn -B -f example-consumer/pom.xml clean test

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Build and test
        run: mvn -B clean test

      - name: Install to local repo
        run: mvn -B install -DskipTests

      - name: Test example-consumer
        run: mvn -B -f example-consumer/pom.xml clean test
